<!DOCTYPE html>
<html>
    <head>
        <title>
            formatting tag Example
        </title>
    </head>
    <body>
        <h1>Formating tags Example</h1><br>
        <p><strong>This is bold tag</strong></p><br>
        <em>this is itallic Text</em><br>
        <u>This is the underline text</u><br>
        <mark>This tag is highlighted</mark><br>
        <small>This is smaller text</small><br>
        <del>This text is deleted</del><br>
        <ins>This text is inserted</ins><br>
        <p>hai<sub>this is subscript</sub></p><br>
        <p>hai<sup>this is suparscript</sup></p>
    </body>
</html>
