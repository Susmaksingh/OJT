<!DOCTYPE html>
<html>
    <head>
        <style>
            /*  style for h1  */
            h1{
                color: aqua;
                background-color: rgb(220, 135, 7);
                text-shadow: 2px 2px;
                text-indent: 50px;
            }
            h2{
                color: rgb(rgb(94, 225, 168), rgb(147, 164, 64), rgb(73, 73, 178));
                background-color: palevioletred;
                text-indent: 50px;
            }
            h3{
                line-height: 5.5;
            }
            p.a{
                font: 15px Arial, sana-serif;
            }
            p.b{
                font: italic small-caps bold 12px Georgia, serif;
            }

            ul{
                font-size: 2.5em;
            }
            li{
                border: 2px solid black;
            }
            div{
                border: 2px solid black;
                background-color: rgb(243, 246, 246);
            }
            .inside{
                list-style-position: inside;
                background-color: bisque;
                border: 3px solid hotpink;
            }
            .outside{
                list-style-position: outside;
                background-color: rgb(223, 152, 152);
            }
        </style>
    </head>
    <body>
        <h1>CSS color</h1>
        <h2>CSS background-color</h2>
        <h3> ADIT</h3>
        <p class="a">this is  a paragraph with ont size 15 pxl</p>
        <p class="b">this is  a paragraph with ont size 25 pxl</p>

        <div>
            <ul class="inside">
                <li>Orange</li>
                <li>Kiwi</li>
                <li>Mango</li>
                <li>Apple</li>
            </ul>
            <ul class="outside">
                <li>Parrot</li>
                <li>Swan</li>
                <li>Pegion</li>
                <li>Crow</li>
            </ul>
        </div>
    </body>
</html>
