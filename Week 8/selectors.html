<!DOCTYPE html>
<html>
    <head>
        <style>
            /* Eelement selector*/
            p{
                text-align: center;
                color: pink;
            }
            /* ID selector  */
            #para1{
                text-align: center;
                background-color: rgb(119, 29, 152);
            }
            /* class selectors  */
            .center{
                text-align: center;
                background-color: rgb(13, 80, 57);
            }
        </style>
    </head>
    <body>
        <p>Edunet Foundation</p>
        <p id="para1">Techno</p>
        <p class="center">IBM</p>
    </body>
</html>
